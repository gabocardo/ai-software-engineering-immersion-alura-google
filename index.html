    <script>
      // Ignorar erros esperados de WebSocket / HMR no ambiente AI Studio iframe
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('@vite/client') || e.message.includes('ModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e.reason && (e.reason.message || e.reason.stack || e.reason));
        if (str.includes('WebSocket') || str.includes('@vite/client') || str.includes('ModuleRunnerTransport')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
